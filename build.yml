name: build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      - name: Collect the mod jar
        run: |
          mkdir -p dist
          cp build/libs/jaxclient-*.jar dist/
          rm -f dist/*-sources.jar
          ls -l dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaxclient-jar
          path: dist/*.jar

      - name: Publish release (direct .jar download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls dist/*.jar | head -n 1)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$JAR" \
            --title "JaxClient (latest build)" \
            --notes "Download the .jar below and drop it into your Fabric 1.21.4 mods folder. Requires Fabric API." \
            --target "${{ github.sha }}"
